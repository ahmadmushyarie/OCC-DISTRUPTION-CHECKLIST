HTML
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCC Disruption Live Control Room</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background-color: #0b1329; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
</style>
</head>
<body class="p-6">
  <!-- Header -->
  <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-blue-400">✈ OCC DISRUPTION LIVE BOARD</h1>
      <p class="text-xs text-slate-400">Secure Internal Operations • AirAsia Crew Control</p>
    </div>
    <div class="flex gap-3">
      <span class="inline-flex items-center gap-2 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-3 py-1.5 rounded-full font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> SECURE PRIVATE SYNC
      </span>
    </div>
  </div>

  <!-- Quick Action Form -->
  <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-6 shadow-xl">
    <h2 class="text-sm font-semibold text-slate-300 mb-3 uppercase tracking-wider">Trigger New Disruption Event</h2>
    <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
      <input id="flightInput" type="text" placeholder="Flight No (AK5202)" class="bg-slate-950 border border-slate-800 text-sm rounded-lg px-3 py-2 text-white outline-none focus:border-blue-500">
      <input id="acInput" type="text" placeholder="A/C Reg (9M-AGQ)" class="bg-slate-950 border border-slate-800 text-sm rounded-lg px-3 py-2 text-white outline-none focus:border-blue-500">
      <input id="controllerInput" type="text" placeholder="Controller Name" class="bg-slate-950 border border-slate-800 text-sm rounded-lg px-3 py-2 text-white outline-none focus:border-blue-500">
      <select id="typeInput" class="bg-slate-950 border border-slate-800 text-sm rounded-lg px-3 py-2 text-white outline-none focus:border-blue-500">
        <option value="AOG / Technical">1. AOG / Technical</option>
        <option value="Pairing Change">2. Pairing Change</option>
        <option value="Unforeseen Night Stop">3. Unforeseen Night Stop</option>
        <option value="Add Sector">4. Add Sector</option>
      </select>
      <button onclick="createDisruption()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm rounded-lg px-4 py-2 transition-all shadow-lg shadow-blue-600/20">+ Launch Event</button>
    </div>
  </div>

  <!-- Live Board Grid -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Active Events -->
    <div class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-4">
      <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400 mb-4 flex justify-between">
        <span>⚠️ Active / In Progress</span>
        <span id="activeCount" class="bg-amber-400/10 px-2 py-0.5 rounded text-amber-400">0</span>
      </h3>
      <div id="activeList" class="space-y-4"></div>
    </div>

    <!-- DM Monitoring -->
    <div class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-4">
      <h3 class="text-xs font-bold uppercase tracking-wider text-blue-400 mb-4 flex justify-between">
        <span>👀 Pending DM Acknowledge</span>
        <span id="reviewCount" class="bg-blue-400/10 px-2 py-0.5 rounded text-blue-400">0</span>
      </h3>
      <div id="reviewList" class="space-y-4"></div>
    </div>

    <!-- Resolved -->
    <div class="bg-slate-900/50 border border-slate-800/80 rounded-xl p-4">
      <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-400 mb-4 flex justify-between">
        <span>✅ Cleared & Closed</span>
        <span id="resolvedCount" class="bg-emerald-400/10 px-2 py-0.5 rounded text-emerald-400">0</span>
      </h3>
      <div id="resolvedList" class="space-y-4"></div>
    </div>
  </div>

<script>
  const workflowChecklists = {
    "AOG / Technical": [
      "Check crew position",
      "Inform crew A/C change or option & advise new bay",
      "Sent documentation to GTR (Call GTR after sent)",
      "Check delay tolerance",
      "Check crew legality"
    ],
    "Pairing Change": [
      "Check crew position",
      "Update pairing",
      "Inform crew pairing change",
      "Check documentation",
      "Check bay",
      "Check delay tolerance",
      "Check crew legality"
    ],
    "Unforeseen Night Stop": [
      "Advise crew planning of departure / tentative plan",
      "Sent email to Station and advise DM to inform station",
      "Create Work Vivo group add management",
      "Update roster accordingly with the plan",
      "Check crew legality"
    ],
    "Add Sector": [
      "Check crew position (Inform DM if ACARS required)",
      "Sent documentation to GTR (Call GTR after sent)",
      "Check delay tolerance",
      "Check crew legality",
      "Sent Extend crew meal to IFC"
    ]
  };

  let events = [];

  function createDisruption() {
    const flight = document.getElementById('flightInput').value.trim();
    const ac = document.getElementById('acInput').value.trim();
    const controller = document.getElementById('controllerInput').value.trim() || 'Controller';
    const type = document.getElementById('typeInput').value;

    if(!flight) return alert('Sila masukkan Flight Number!');

    const tasks = workflowChecklists[type].map(taskText => ({ text: taskText, done: false }));

    const newEvent = {
      id: Date.now(),
      flight,
      ac,
      controller,
      type,
      tasks,
      status: 'active',
      time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
    };

    events.unshift(newEvent);
    document.getElementById('flightInput').value = '';
    document.getElementById('acInput').value = '';
    render();
  }

  function toggleTask(eventId, taskIndex) {
    events = events.map(e => {
      if(e.id === eventId) {
        e.tasks[taskIndex].done = !e.tasks[taskIndex].done;
      }
      return e;
    });
    render();
  }

  function moveStatus(id, newStatus) {
    events = events.map(e => e.id === id ? {...e, status: newStatus} : e);
    render();
  }

  function render() {
    const activeList = document.getElementById('activeList');
    const reviewList = document.getElementById('reviewList');
    const resolvedList = document.getElementById('resolvedList');

    activeList.innerHTML = '';
    reviewList.innerHTML = '';
    resolvedList.innerHTML = '';

    let activeC = 0, reviewC = 0, resolvedC = 0;

    events.forEach(e => {
      const completedCount = e.tasks.filter(t => t.done).length;
      const totalCount = e.tasks.length;
      const progressPercent = (completedCount / totalCount) * 100;

      let tasksHtml = '';
      e.tasks.forEach((t, i) => {
        tasksHtml += `
          <label class="flex items-start gap-2 text-xs text-slate-300 cursor-pointer hover:text-white py-1">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${e.id}, ${i})" class="mt-0.5 rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-0">
            <span class="${t.done ? 'line-through text-slate-500' : ''}">${t.text}</span>
          </label>
        `;
      });

      const card = `
        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl shadow-lg">
          <div class="flex justify-between items-start mb-1">
            <div>
              <span class="text-base font-bold text-white tracking-wide">${e.flight}</span>
              <span class="text-xs font-mono text-slate-400 ml-1">(${e.ac || 'N/A'})</span>
            </div>
            <span class="text-[10px] font-mono bg-slate-900 px-2 py-0.5 rounded text-slate-400 border border-slate-800">${e.time}</span>
          </div>

          <div class="text-xs text-slate-400 mb-2">By: <b class="text-slate-200">${e.controller}</b></div>
          <div class="text-xs font-semibold text-blue-400 mb-3 bg-blue-500/10 px-2 py-1 rounded border border-blue-500/20 inline-block">${e.type}</div>

          <!-- Progress Bar -->
          <div class="mb-3">
            <div class="flex justify-between text-[11px] text-slate-400 mb-1 font-mono">
              <span>Progress</span>
              <span>${completedCount}/${totalCount} (${Math.round(progressPercent)}%)</span>
            </div>
            <div class="w-full bg-slate-900 rounded-full h-1.5 overflow-hidden">
              <div class="bg-emerald-500 h-1.5 transition-all duration-300" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <!-- Interactive Checklist -->
          <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-800/60 mb-3 space-y-0.5">
            ${tasksHtml}
          </div>

          <!-- Actions -->
          <div class="pt-2 border-t border-slate-900">
            ${e.status === 'active' ? `<button onclick="moveStatus(${e.id}, 'review')" class="w-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-xs py-2 rounded-lg font-semibold border border-amber-500/20 transition-all">Submit to DM Review →</button>` : ''}
            ${e.status === 'review' ? `<button onclick="moveStatus(${e.id}, 'resolved')" class="w-full bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 text-xs py-2 rounded-lg font-semibold border border-emerald-500/20 transition-all">✓ DM Acknowledge & Close</button>` : ''}
            ${e.status === 'resolved' ? `<div class="text-center text-xs text-emerald-400 font-semibold py-1">✓ Case Cleared & Archived</div>` : ''}
          </div>
        </div>
      `;

      if(e.status === 'active') { activeList.innerHTML += card; activeC++; }
      else if(e.status === 'review') { reviewList.innerHTML += card; reviewC++; }
      else if(e.status === 'resolved') { resolvedList.innerHTML += card; resolvedC++; }
    });

    document.getElementById('activeCount').innerText = activeC;
    document.getElementById('reviewCount').innerText = reviewC;
    document.getElementById('resolvedCount').innerText = resolvedC;
  }
</script>
</body>
</html>
